<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui; padding: 16px; width: 300px; margin: 0; }
    h3 { margin: 0 0 14px; font-size: 15px; color: #0a66c2; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    button { width: 100%; margin-top: 10px; padding: 9px; background: #0a66c2; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:hover { background: #004182; }
    #status { font-size: 12px; margin-top: 8px; text-align: center; color: green; min-height: 16px; }
    .hint { font-size: 11px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
  <h3>OutreachAI</h3>
  <label>Groq API Key</label>
  <input type="password" id="apiKey" placeholder="gsk_...">
  <p class="hint">Get your Groq API key at <a href="https://console.groq.com/keys" target="_blank">console.groq.com</a>.</p>
  <button id="save">Save</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
